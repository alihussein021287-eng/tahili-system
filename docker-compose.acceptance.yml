# Standalone only. No existing volumes, host database ports, env_file or production settings.
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-p", "55432", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_DB_PASSWORD:?generated by runner}
      POSTGRES_DB: acceptance_${ACCEPTANCE_RUN_ID:?generated by runner}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ACCEPTANCE_APP_PORT:?generated by runner}:${ACCEPTANCE_APP_PORT}"
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 55432 -U acceptance -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: tahili-acceptance-${ACCEPTANCE_RUN_ID:?generated by runner}:local
    build:
      context: .
      dockerfile: Dockerfile.acceptance
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TAHILI_ENVIRONMENT: acceptance
      TAHILI_DISPOSABLE_TEST_DB: "1"
      ACCEPTANCE_RUN_ID: ${ACCEPTANCE_RUN_ID}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      ACCEPTANCE_DB_PASSWORD: ${ACCEPTANCE_DB_PASSWORD}
      ACCEPTANCE_APP_PORT: ${ACCEPTANCE_APP_PORT}
      DATABASE_URL: postgresql://acceptance:${ACCEPTANCE_DB_PASSWORD}@127.0.0.1:55432/acceptance_${ACCEPTANCE_RUN_ID}
      E2E_BASE_URL: http://127.0.0.1:${ACCEPTANCE_APP_PORT}
      NEXTAUTH_URL: http://127.0.0.1:${ACCEPTANCE_APP_PORT}
      NEXTAUTH_URL_INTERNAL: http://127.0.0.1:${ACCEPTANCE_APP_PORT}
      ACCEPTANCE_OUTPUT_DIR: /evidence
      QA_CREDENTIALS_PATH: /tmp/acceptance-credentials.tsv
    volumes:
      - type: bind
        source: ${ACCEPTANCE_EVIDENCE_DIR:?generated by runner}
        target: /evidence
    shm_size: 512mb
    tmpfs:
      - /tmp
networks:
  isolated:
    internal: true
