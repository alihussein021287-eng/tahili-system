name: tahili-monitoring

x-monitoring-service: &monitoring-service
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  labels:
    com.tahili.component: "monitoring"
    com.tahili.environment: "production"
  logging:
    driver: local
    options: { max-size: "10m", max-file: "3" }

services:
  grafana:
    <<: *monitoring-service
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3002:3000"]
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.50", memory: 512M } } }

  loki:
    <<: *monitoring-service
    image: grafana/loki:2.9.6@sha256:6ca6e2cd3b6f45e0eb298da2920610fde63ecd8ab6c595d9c941c8559d1d9407
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - loki-data:/loki
      - ./monitoring/production/loki.yml:/etc/loki/loki.yml:ro
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.40", memory: 512M } } }

  promtail:
    <<: *monitoring-service
    image: grafana/promtail:2.9.6@sha256:c0e57ee03512475e982893622544d76da4e3c3671a72425c670ccfc0024a4187
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - promtail-positions:/positions
      - ./monitoring/production/promtail.yml:/etc/promtail/promtail.yml:ro
    networks: [monitoring_internal]
    depends_on: [loki]
    deploy: { resources: { limits: { cpus: "0.15", memory: 128M } } }

  tempo:
    <<: *monitoring-service
    image: grafana/tempo:2.9.4@sha256:3ecdaa1af90b3068e77e4fb4b11d9f26201c3a57d5740d34965a323173a4f1aa
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo-data:/var/tempo
      - ./monitoring/production/tempo.yml:/etc/tempo/tempo.yml:ro
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.30", memory: 384M } } }

  alloy:
    <<: *monitoring-service
    image: grafana/alloy:v1.16.2@sha256:32913cbfac652d15fa84d256a74e5ee3f71575961bb19d34796ce3838bfba693
    user: "473:473"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/tmp/alloy"]
    volumes: ["./monitoring/production/alloy.config.alloy:/etc/alloy/config.alloy:ro"]
    networks: [monitoring_internal]
    depends_on: [loki, prometheus, tempo]
    deploy: { resources: { limits: { cpus: "0.25", memory: 256M } } }

  observability-gateway:
    <<: *monitoring-service
    image: public.ecr.aws/docker/library/node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    command: ["node", "/etc/tahili-gateway/gateway.mjs"]
    volumes:
      - ./monitoring/production/gateway.mjs:/etc/tahili-gateway/gateway.mjs:ro
      - ./monitoring/production/gateway-policy.mjs:/etc/tahili-gateway/gateway-policy.mjs:ro
    networks:
      monitoring_internal:
        ipv4_address: 172.30.254.3
      observability:
        ipv4_address: 172.30.255.3
        aliases: [prometheus, alertmanager, loki, tempo, alloy]
    deploy: { resources: { limits: { cpus: "0.10", memory: 96M } } }

  prometheus:
    <<: *monitoring-service
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command:
      ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-remote-write-receiver"]
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/production/rules.yml:/etc/prometheus/rules/production.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks:
      monitoring_internal:
        ipv4_address: 172.30.254.2
    depends_on: [alertmanager]
    deploy: { resources: { limits: { cpus: "0.50", memory: 768M } } }

  alertmanager:
    <<: *monitoring-service
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - alertmanager-data:/alertmanager
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.20", memory: 192M } } }

  node-exporter:
    <<: *monitoring-service
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    profiles: [host-metrics]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.15", memory: 128M } } }

  cadvisor:
    <<: *monitoring-service
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    profiles: [host-metrics]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    privileged: false
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.30", memory: 384M } } }

  postgres-exporter:
    <<: *monitoring-service
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    profiles: [database-metrics]
    read_only: true
    environment:
      DATA_SOURCE_NAME_FILE: /run/secrets/postgres_exporter_dsn
    secrets: [postgres_exporter_dsn]
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.15", memory: 128M } } }

  blackbox-exporter:
    <<: *monitoring-service
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    profiles: [dependency-probes]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    networks: [monitoring_internal]
    deploy: { resources: { limits: { cpus: "0.15", memory: 128M } } }

networks:
  monitoring_internal:
    internal: true
    ipam:
      config: [{ subnet: 172.30.254.0/28, gateway: 172.30.254.1 }]
  observability:
    name: tahili-observability
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.255.0/28, gateway: 172.30.255.1 }]

volumes:
  grafana-data: { name: tahili-monitoring-grafana-data }
  loki-data: { name: tahili-monitoring-loki-data }
  promtail-positions: { name: tahili-monitoring-promtail-positions }
  tempo-data: { name: tahili-monitoring-tempo-data }
  prometheus-data: { name: tahili-monitoring-prometheus-data }
  alertmanager-data: { name: tahili-monitoring-alertmanager-data }

secrets:
  grafana_admin_password:
    file: ./.secrets/production-monitoring/grafana_admin_password
  postgres_exporter_dsn:
    file: ./.secrets/production-monitoring/postgres_exporter_dsn
