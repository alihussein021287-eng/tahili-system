# Clean preview (Mission 09.2): own project, own app/MinIO/uploads, own DB role limited to tahili_preview. QA (3101) is not touched.
# Start: docker compose -p tahili-clean-preview --env-file "<private>/preview.env" -f docker-compose.preview3102.yml up -d
# Stop:  docker compose -p tahili-clean-preview -f docker-compose.preview3102.yml stop   (volumes kept)
services:
  preview-minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PREVIEW_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${PREVIEW_MINIO_PASSWORD:?required}
    volumes: [preview_miniodata:/data]
    networks: [preview_internal]

  preview-app:
    image: tahili-clean-rehearsal:${PREVIEW_RELEASE_TAG:?required}
    command: ["npx", "next", "start", "-p", "3102", "-H", "0.0.0.0"]
    depends_on: [preview-minio]
    environment:
      NODE_ENV: production
      TAHILI_ENVIRONMENT: development
      FARO_ENABLED: "false"
      OTEL_ENABLED: "false"
      TAHILI_LOCAL_ACCESS: "true"
      TAHILI_LOCAL_PORT: "3102"
      NEXTAUTH_URL: http://localhost:3102
      NEXTAUTH_URL_INTERNAL: http://localhost:3102
      NEXTAUTH_ALLOW_HTTP_LOGIN: "true"
      AUTH_TRUST_HOST: "true"
      ALLOW_INITIAL_SETUP: "false"
      DATABASE_URL: postgresql://tahili_preview_app:${PREVIEW_DB_PASSWORD:?required}@postgres:5432/tahili_preview
      NEXTAUTH_SECRET: ${PREVIEW_NEXTAUTH_SECRET:?required}
      REMINDER_KEY: ${PREVIEW_REMINDER_KEY:?required}
      MINIO_ENDPOINT: preview-minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${PREVIEW_MINIO_USER:?required}
      MINIO_SECRET_KEY: ${PREVIEW_MINIO_PASSWORD:?required}
      COLLABORATION_MINIO_BUCKET: tahili-clean-preview
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Baghdad
      # Mission: owner-authorised patient import on the clean preview ONLY (never set this on the 3101/QA stack).
      DATA_CENTER_APPLY_ENABLED: "true"
      DATA_CENTER_FORBIDDEN_DATABASES: tahili_rehearsal
    volumes: [preview_uploads:/app/uploads]
    ports:
      - "127.0.0.1:3102:3102"
    networks: [preview_internal, rehearsal_db, edge]

networks:
  preview_internal:
    internal: true
  rehearsal_db:
    external: true
    name: tahili-clean-rehearsal_rehearsal
  edge: {}

volumes:
  preview_miniodata:
  preview_uploads:
