global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

rule_files: ["/etc/prometheus/rules/*.yml"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: faro-adapter
    metrics_path: /api/observability/faro/metrics
    static_configs: [{ targets: ["observability-gateway:9101"] }]
